<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  body { width: 220px; margin: 0; padding: 14px; font: 13px/1.4 system-ui, sans-serif; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  button {
    width: 100%; padding: 9px 12px; border: 0; border-radius: 6px;
    cursor: pointer; font-weight: 600; font-size: 13px;
    transition: background .15s;
  }
  .primary { background: #4f46e5; color: #fff; }
  .danger { background: #dc2626; color: #fff; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .status { color: #6b7280; font-size: 12px; flex: 1; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; }
  .dot.live { background: #10b981; animation: pulse 1.5s infinite; }
  .dot.rec  { background: #ef4444; animation: pulse 1s   infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .hint { margin-top: 10px; font-size: 11px; color: #9ca3af; line-height: 1.5; }
</style>
</head>
<body>
  <div class="row">
    <span id="dot" class="dot"></span>
    <span id="status" class="status">未在 Suno 页面</span>
  </div>
  <button id="toggle" class="primary" disabled>开始录制</button>
  <div class="hint" id="hint">打开 Suno 歌曲页面并播放，扩展自动捕获音频流。</div>
  <script src="popup.js"></script>
</body>
</html>
